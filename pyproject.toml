[project]
name = "rolekv"
version = "0.1.0"
description = "Shared-KV role adapters for coding agents (LA Hacks)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.14",
    "transformers>=5.20",
    "peft==0.21.2",
    "accelerate>=1.15",
    "datasets>=5.1",
    "anthropic>=1.15",
    "python-dotenv>=1.2",
]

[dependency-groups]
dev = ["pytest>=9.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rolekv"]

# CUDA build of torch on Windows and Linux; macOS uses the default PyPI build.
# cu126 needs an older NVIDIA driver than cu130, so it works on more laptops.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
